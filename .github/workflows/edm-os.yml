name: EDM OS

# The audit found no CI at all: nothing ran a build, a type check or an audit on
# push. These are the checks that stop the two failures that would be worst and
# quietest — a broken build and a hole in the organisation boundary.

on:
  push:
    paths: ["EDM-V13-MASTER/11-EDM-OS/system/edm-os/**", ".github/workflows/edm-os.yml"]
  pull_request:
    paths: ["EDM-V13-MASTER/11-EDM-OS/system/edm-os/**", ".github/workflows/edm-os.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: EDM-V13-MASTER/11-EDM-OS/system/edm-os

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: edm
          POSTGRES_PASSWORD: edm
          POSTGRES_DB: edmos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edm -d edmos"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql://edm:edm@localhost:5432/edmos?schema=public
      SUPABASE_JWT_SECRET: ci-secret-of-at-least-thirty-two-characters
      CORS_ORIGIN: http://localhost:3000
      API_PORT: "4000"
      API_URL: http://localhost:4000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: EDM-V13-MASTER/11-EDM-OS/system/edm-os/package-lock.json

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Type check
        run: npm run typecheck

      - name: Build API
        run: npm --workspace apps/api run build

      - name: Build web
        run: npm --workspace apps/web run build

      - name: Push schema and seed
        run: npm run db:push && npm run db:seed

      - name: Start API
        run: |
          node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf "$API_URL/api/v1/health" >/dev/null && exit 0
            sleep 2
          done
          echo "API did not become healthy:"; cat /tmp/api.log; exit 1

      - name: Test — pricing, labour, auth and tenant isolation
        run: npm test

      - name: Dependency audit
        # Reported, not blocking: an advisory published upstream should not stop a
        # release on its own, but it must be visible on every push.
        run: npm audit --audit-level=high || true
